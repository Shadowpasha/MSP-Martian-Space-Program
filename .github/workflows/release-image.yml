# When a GitHub release is published with the web export attached (msp-web.tar.gz, made by
# scripts/release.ps1), build the website image and publish it to GitHub's container registry:
#   ghcr.io/<owner>/<repo>:latest  and  :<release tag>
# Estella exports the web build only from the editor, so the export comes from the release asset.
name: Release website image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the web export from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --pattern 'msp-web.tar.gz' --dir .
          mkdir -p dist/web
          tar -xzf msp-web.tar.gz -C dist/web
          test -f dist/web/index.html

      - name: Image name (the registry needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.event.release.tag_name }}
