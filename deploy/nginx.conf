server {
    listen 8070;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Older nginx mime tables do not know WebAssembly.
    types { application/wasm wasm; }
    include /etc/nginx/mime.types;

    gzip on;
    gzip_types text/javascript application/javascript application/json application/wasm text/css;

    # Revalidate everything, so a new release shows up right away (Cloudflare will not keep a
    # stale copy; unchanged files come back as fast 304s).
    add_header Cache-Control "no-cache";

    location / {
        try_files $uri $uri/ =404;
    }
}
